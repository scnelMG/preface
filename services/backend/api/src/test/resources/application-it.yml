# 통합 테스트(@Tag("integration")) 전용. 로컬은 Testcontainers가 접속 정보를 덮어쓰고,
# CI(be:it)는 환경 변수 DB_URL·DB_USERNAME·DB_PASSWORD·REDIS_HOST로 GitLab services에 붙는다.
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/preface}
    username: ${DB_USERNAME:test}
    password: ${DB_PASSWORD:test}
  flyway:
    enabled: true

preface:
  auth:
    # 테스트 전용 값(실제 비밀 아님)
    jwt-secret: integration-test-only-signing-key-not-a-real-secret
    allowed-redirect-uris: http://localhost:3000/oauth/kakao
  # presign은 네트워크 없이 서명만 한다. 접속하지 않는 주소와 가짜 키(실제 비밀 아님)
  storage:
    endpoint: http://localhost:9000
    region: ap-northeast-2
    bucket: preface-it
    access-key: it-fake-access-key
    secret-key: it-fake-secret-key-not-a-real-secret
    path-style-access: true
  capture:
    qr-base-url: http://localhost:3000
  internal:
    secret: integration-test-only-internal-secret-not-real
