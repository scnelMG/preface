openapi: 3.1.0
info:
  title: Preface 3D 복원 워커 내부 API (INT-REC-01~04)
  version: 1.0.0
  description: |
    GPU 워커(Runpod, 외부망) ↔ Spring 작업 API. 워커가 Spring에 HTTPS로 붙어 작업을 가져가고(pull) 보고한다.
    워커는 Redis·MySQL·S3 자격 증명을 갖지 않는다. 파일은 Spring이 발급한 presigned URL로만 주고받는다.
    흐름·재시도·회수 규칙은 같은 폴더 `README.md`를 본다.

    - 인증: 모든 요청에 `X-Internal-Secret`(공유 시크릿). 틀리거나 없으면 401 `AUTH_001`.
    - 작업별 요청(INT-REC-02~04)에는 claim 때 보낸 값과 같은 `X-Worker-Id`도 붙인다.
    - 응답은 외부 API와 같은 공통 형식 `{ success, data, error }`. 시간은 ISO-8601 UTC.
    - 서명 URL·시크릿은 로그에 남기지 않는다(양쪽 모두).
servers:
  - url: https://{springHost}
    description: Spring API. 외부에 열리는 경로라 공유 시크릿이 필수다
    variables:
      springHost:
        default: api.example.invalid
security:
  - internalSecret: []
paths:
  /internal/v1/reconstruction-jobs/claim:
    post:
      operationId: claimJob
      summary: INT-REC-01 다음 작업 하나 가져가기
      description: |
        프레임 추출이 끝난 작업을 먼저 들어온 순서로 하나 넘긴다. 입력은 원본 영상이 아니라 프레임 묶음(tar)이다
        (`contracts/frame-extraction/README.md` "묶음 형식"). 넘긴 작업은 `RUNNING`이 되고(startedAt 기록) 결과 보고 전까지
        Spring 쪽 처리 중 목록에 남는다(워커가 죽어도 사라지지 않는다).
        작업이 없으면 204. 워커는 204를 받으면 몇 초(권장 3~5초, 지터 포함) 쉬고 다시 부른다.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/claim-request.schema.json' }
            example: { workerId: runpod-synthetic-01.0 }
      responses:
        '200':
          description: 작업 하나
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { const: true }
                  data: { $ref: './schemas/claim-response.schema.json' }
                  error: { type: 'null' }
        '204':
          description: 대기 중인 작업 없음(본문 없음)
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /internal/v1/reconstructions/{jobId}/progress:
    post:
      operationId: reportProgress
      summary: INT-REC-02 진행 보고·하트비트
      description: |
        단계가 바뀔 때, 그리고 단계가 그대로여도 `heartbeatIntervalSec`마다 보낸다(같은 stage 재전송은 멱등).
        응답 `continue=false`면 작업이 취소·회수됐거나 이미 끝난 것이다. 즉시 멈추고 임시 파일과 올린 출력 객체를 지운다.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/progress-request.schema.json' }
            example: { status: RUNNING, stage: RECONSTRUCT, engine: VGGT }
      responses:
        '200':
          description: 기록함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProgressEnvelope' }
              examples:
                running: { value: { success: true, data: { continue: true }, error: null } }
                stop: { value: { success: true, data: { continue: false }, error: null } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/ServerError' }
  /internal/v1/reconstructions/{jobId}/output-urls:
    post:
      operationId: issueOutputUrls
      summary: INT-REC-04 결과 객체 업로드 URL 발급 [제안]
      description: |
        결과(메시·리그·표정 리그·텍스처·썸네일)와 5방향 얼굴 사진(captures)을 올리기 직전에 부른다. presigned PUT 10개(만료 10분)를 준다. 만료되면 다시 부른다.
        작업이 이 워커의 RUNNING 작업이 아니면 409 `REC_022`(회수됨) 또는 `REC_020`(취소됨).
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/WorkerId'
      responses:
        '200':
          description: 업로드 URL
          content:
            application/json:
              schema:
                type: object
                required: [success, data, error]
                properties:
                  success: { const: true }
                  data: { $ref: './schemas/output-urls-response.schema.json' }
                  error: { type: 'null' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
  /internal/v1/reconstructions/{jobId}/result:
    post:
      operationId: reportResult
      summary: INT-REC-03 결과 보고 (성공·실패)
      description: |
        - `SUCCEEDED`: Spring이 `face_model`과 5방향 사진(`captureImages`, 필수)을 저장하고, 원본 영상을 즉시 삭제 대상으로 표시하고, 사용자 알림을 만든다. 응답 `faceModelId`.
        - `FAILED`: 실패 코드를 기록하고 원본 영상 삭제를 24시간 뒤로 예약하고, 사용자 알림을 만든다. 응답 `faceModelId=null`.
        - 보고가 처리되면 작업이 처리 중 목록에서 빠진다.
        - 멱등: 같은 status를 다시 보내면 처음 결과를 그대로 돌려준다(200). 네트워크 오류면 같은 본문으로 재시도한다.
        - 409 `REC_020` 작업이 CANCELED → 올린 출력 객체를 지운다.
        - 409 `REC_021` 이미 다른 결과가 기록됨 → 재시도하지 않는다.
        - 409 `REC_022` 다른 워커에 재배정됨 → 올린 출력 객체를 지우고 재시도하지 않는다.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/WorkerId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './schemas/result-request.schema.json' }
            examples:
              succeeded: { externalValue: './fixtures/result-succeeded.json' }
              failed: { externalValue: './fixtures/result-failed.json' }
      responses:
        '200':
          description: 기록함
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultEnvelope' }
              examples:
                succeeded:
                  value:
                    success: true
                    data: { faceModelId: 3f1c2a9e-5b7d-4c1e-9a2f-6d8e0b4c7a11 }
                    error: null
                failed: { value: { success: true, data: { faceModelId: null }, error: null } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/ServerError' }
components:
  securitySchemes:
    internalSecret:
      type: apiKey
      in: header
      name: X-Internal-Secret
      description: |
        Spring 환경 변수 `INTERNAL_API_SECRET`과 같은 값(32바이트 이상 무작위 문자열). 워커도 환경 변수로만 받는다.
        Spring은 상수 시간 비교로 검사한다. 로그·예외 메시지에 남기지 않는다. 교체 시 Spring과 워커를 함께 바꾼다.
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      description: claim 응답의 `jobId`
      schema: { type: string, format: uuid }
    WorkerId:
      name: X-Worker-Id
      in: header
      required: true
      description: claim 때 보낸 `workerId`
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
  schemas:
    ProgressEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        data:
          type: object
          required: [continue]
          properties:
            continue:
              type: boolean
              description: false면 즉시 중단·임시 파일과 출력 객체 삭제
        error: { type: 'null' }
    ResultEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: true }
        data:
          type: object
          required: [faceModelId]
          properties:
            faceModelId:
              type: [string, 'null']
              format: uuid
              description: SUCCEEDED면 만든 3D 얼굴 모델 ID, FAILED면 null
        error: { type: 'null' }
    ErrorEnvelope:
      type: object
      required: [success, data, error]
      properties:
        success: { const: false }
        data: { type: 'null' }
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [COMMON_001, COMMON_002, COMMON_999, AUTH_001, REC_020, REC_021, REC_022]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }
  responses:
    BadRequest:
      description: '`COMMON_001` 본문·헤더 형식 위반(예: 출력 key가 현재 시도에 발급한 key와 다름, 모르는 stage, X-Worker-Id 없음)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthorized:
      description: '`AUTH_001` X-Internal-Secret 없음·불일치. 설정 오류이므로 재시도하지 말고 알린다'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    NotFound:
      description: '`COMMON_002` 모르는 jobId. 작업을 버린다(재시도 금지)'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Conflict:
      description: '`REC_020` 취소된 작업 / `REC_021` 이미 다른 결과가 기록됨 / `REC_022` 다른 워커에 재배정됨'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ServerError:
      description: '`COMMON_999` Spring 내부 오류. 지수 백오프로 재시도한다'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
